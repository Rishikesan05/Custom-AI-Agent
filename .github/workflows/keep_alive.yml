name: Keep Streamlit Apps Awake

on:
  schedule:
    # Runs every hour at minute 0 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Apps
        run: |
          echo "Pinging AI Document Search..."
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -o /dev/null -w "AI-Document-Search Status: %{http_code}\n" \
            https://aidoc-rishiware.streamlit.app/ || true

          echo "Pinging Custom AI Agent..."
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -o /dev/null -w "Custom-AI-Agent Status: %{http_code}\n" \
            https://aiagent-rishiware.streamlit.app/ || true
